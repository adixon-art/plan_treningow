<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan Treningów</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f14; --bg2: #161820; --bg3: #1e2030; --bg4: #252840;
    --border: #2e3155; --text: #e0e2f0; --text-dim: #8890b0;
    --accent: #5c6bc0; --accent2: #7986cb;
    --run: #76c442; --walk: #2e7d32; --strength: #e53935;
    --swim: #1e88e5; --mix: #f9a825;
    --radius: 12px; --shadow: 0 4px 24px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Nunito', sans-serif; min-height: 100vh; padding: 24px 16px 60px; }

  #syncStatus {
    max-width: 720px; margin: 0 auto 12px;
    display: flex; align-items: center; gap: 8px;
    font-size: 0.78rem; color: var(--text-dim);
    padding: 6px 12px; border-radius: 8px;
    background: var(--bg2); border: 1px solid var(--border);
    transition: all 0.3s;
  }
  #syncStatus.syncing { color: var(--accent2); border-color: var(--accent); }
  #syncStatus.error   { color: #f44336; border-color: #f44336; }
  #syncStatus.ok      { color: #4caf50; border-color: #4caf50; }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  #syncStatus.syncing .sync-dot { animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  h1 { font-family: 'Rajdhani', sans-serif; font-size: 2rem; font-weight: 700; letter-spacing: 2px; text-align: center; color: var(--accent2); margin-bottom: 24px; text-transform: uppercase; }

  .cal-wrap { max-width: 720px; margin: 0 auto; background: var(--bg2); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; border: 1px solid var(--border); }
  .cal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; background: var(--bg3); border-bottom: 1px solid var(--border); }
  .cal-header h2 { font-family: 'Rajdhani', sans-serif; font-size: 1.4rem; font-weight: 600; letter-spacing: 1px; color: var(--accent2); text-transform: uppercase; }
  .nav-btn { background: var(--bg4); border: 1px solid var(--border); color: var(--text); width: 38px; height: 38px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; transition: background 0.2s, border-color 0.2s; }
  .nav-btn:hover { background: var(--accent); border-color: var(--accent2); }
  .cal-grid { padding: 16px; }
  .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 6px; }
  .weekday { text-align: center; font-size: 0.72rem; font-weight: 700; letter-spacing: 1px; color: var(--text-dim); padding: 4px 0; text-transform: uppercase; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .day { min-height: 72px; border-radius: 8px; background: var(--bg3); border: 1px solid var(--border); padding: 6px 5px 4px; cursor: pointer; transition: border-color 0.2s, background 0.2s; position: relative; display: flex; flex-direction: column; gap: 2px; }
  .day:hover { border-color: var(--accent2); background: var(--bg4); }
  .day.empty { background: transparent; border-color: transparent; cursor: default; }
  .day.today .day-num { color: var(--accent2); font-weight: 700; }
  .day.today { border-color: var(--accent); }
  .day-num { font-size: 0.82rem; font-weight: 600; color: var(--text-dim); line-height: 1; }
  .activity-dot { border-radius: 4px; padding: 2px 4px; font-size: 0.6rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 3px; }
  .activity-dot.done-act { opacity: 0.55; }

  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.72); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
  .overlay.open { display: flex; }
  .modal { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow); animation: slideUp 0.22s ease; }
  @keyframes slideUp { from{transform:translateY(30px);opacity:0} to{transform:translateY(0);opacity:1} }
  .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 14px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg2); z-index: 2; }
  .modal-header h3 { font-family: 'Rajdhani', sans-serif; font-size: 1.2rem; font-weight: 600; letter-spacing: 1px; color: var(--accent2); text-transform: uppercase; }
  .close-btn { background: none; border: none; color: var(--text-dim); font-size: 1.4rem; cursor: pointer; line-height: 1; padding: 2px 6px; border-radius: 6px; transition: color 0.2s, background 0.2s; }
  .close-btn:hover { color: var(--text); background: var(--bg4); }
  .modal-body { padding: 18px 20px; }
  .day-activities { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .act-card { background: var(--bg3); border-radius: 8px; padding: 12px 14px; border-left: 3px solid; }
  .act-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .act-name { font-weight: 700; font-size: 0.95rem; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .act-details { font-size: 0.8rem; color: var(--text-dim); line-height: 1.6; }
  .act-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .btn-sm { padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; cursor: pointer; border: 1px solid; transition: all 0.18s; font-family: 'Nunito', sans-serif; }
  .btn-edit { background: var(--bg4); border-color: var(--border); color: var(--text-dim); }
  .btn-edit:hover { border-color: var(--accent2); color: var(--accent2); }
  .btn-done { background: transparent; border-color: #4caf50; color: #4caf50; }
  .btn-done:hover, .btn-done.is-done { background: rgba(76,175,80,0.15); }
  .btn-del { background: transparent; border-color: var(--border); color: #f44336; }
  .btn-del:hover { background: rgba(244,67,54,0.12); border-color: #f44336; }
  .btn-add { width: 100%; padding: 10px; background: transparent; border: 1.5px dashed var(--border); border-radius: 8px; color: var(--text-dim); font-size: 0.9rem; font-family: 'Nunito', sans-serif; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 4px; }
  .btn-add:hover { border-color: var(--accent2); color: var(--accent2); background: rgba(92,107,192,0.07); }
  .form-section { margin-bottom: 16px; }
  .form-label { display: block; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.8px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; }
  .type-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .type-btn { padding: 8px 4px; border-radius: 7px; border: 2px solid transparent; font-size: 0.75rem; font-weight: 700; cursor: pointer; font-family: 'Nunito', sans-serif; text-align: center; transition: all 0.18s; background: var(--bg3); color: var(--text-dim); }
  .type-btn[data-type="run"]      { border-color: var(--run); }
  .type-btn[data-type="run"].selected      { background: var(--run); color: #fff; }
  .type-btn[data-type="walk"]     { border-color: var(--walk); }
  .type-btn[data-type="walk"].selected     { background: var(--walk); color: #fff; }
  .type-btn[data-type="strength"] { border-color: var(--strength); }
  .type-btn[data-type="strength"].selected { background: var(--strength); color: #fff; }
  .type-btn[data-type="swim"]     { border-color: var(--swim); }
  .type-btn[data-type="swim"].selected     { background: var(--swim); color: #fff; }
  .type-btn[data-type="mix"]      { border-color: var(--mix); }
  .type-btn[data-type="mix"].selected      { background: var(--mix); color: #111; }
  .fields-group { display: flex; flex-direction: column; gap: 10px; }
  .field-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .field-label { font-size: 0.78rem; color: var(--text-dim); min-width: 100px; font-weight: 600; }
  input[type="number"] { background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: 'Nunito', sans-serif; font-size: 0.9rem; padding: 6px 10px; width: 90px; outline: none; transition: border-color 0.2s; }
  input[type="number"]:focus { border-color: var(--accent2); }
  .field-unit { font-size: 0.78rem; color: var(--text-dim); }
  .strength-grid { display: grid; gap: 6px; }
  .strength-row { display: grid; grid-template-columns: 110px 1fr 1fr; align-items: center; gap: 8px; background: var(--bg3); border-radius: 6px; padding: 6px 10px; }
  .strength-ex { font-size: 0.8rem; font-weight: 600; color: var(--text-dim); }
  .strength-row input { width: 100%; }
  .btn-save { width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: 8px; color: #fff; font-family: 'Rajdhani', sans-serif; font-size: 1.05rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
  .btn-save:hover { background: var(--accent2); }
  .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
  .no-acts { text-align: center; color: var(--text-dim); font-size: 0.9rem; padding: 16px 0; }
  .legend { max-width: 720px; margin: 18px auto 0; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--text-dim); font-weight: 600; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  @media (max-width: 500px) {
    .day { min-height: 56px; }
    .type-grid { grid-template-columns: repeat(2, 1fr); }
    .strength-row { grid-template-columns: 90px 1fr 1fr; }
  }
</style>
</head>
<body>

<h1>💪 Plan Treningów</h1>

<div id="syncStatus">
  <div class="sync-dot"></div>
  <span id="syncText">Łączenie z bazą danych...</span>
</div>

<div class="cal-wrap">
  <div class="cal-header">
    <button class="nav-btn" id="prevBtn">&#8249;</button>
    <h2 id="monthLabel"></h2>
    <button class="nav-btn" id="nextBtn">&#8250;</button>
  </div>
  <div class="cal-grid">
    <div class="weekdays">
      <div class="weekday">Pn</div><div class="weekday">Wt</div><div class="weekday">Śr</div>
      <div class="weekday">Cz</div><div class="weekday">Pt</div><div class="weekday">Sb</div><div class="weekday">Nd</div>
    </div>
    <div class="days" id="daysGrid"></div>
  </div>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:var(--run)"></div>Bieg</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--walk)"></div>Marsz</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--strength)"></div>Siłowy</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--swim)"></div>Basen</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--mix)"></div>Mix</div>
</div>

<!-- DAY MODAL -->
<div class="overlay" id="dayOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="dayModalTitle"></h3>
      <button class="close-btn" id="closeDayModal">×</button>
    </div>
    <div class="modal-body">
      <div class="day-activities" id="dayActivitiesList"></div>
      <button class="btn-add" id="addActivityBtn">+ Dodaj aktywność</button>
    </div>
  </div>
</div>

<!-- FORM MODAL -->
<div class="overlay" id="formOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="formModalTitle">Nowa aktywność</h3>
      <button class="close-btn" id="closeFormModal">×</button>
    </div>
    <div class="modal-body">
      <div class="form-section">
        <label class="form-label">Rodzaj aktywności</label>
        <div class="type-grid">
          <button class="type-btn" data-type="run">🏃 Bieg</button>
          <button class="type-btn" data-type="walk">🚶 Marsz</button>
          <button class="type-btn" data-type="strength">🏋️ Siłowy</button>
          <button class="type-btn" data-type="swim">🏊 Basen</button>
          <button class="type-btn" data-type="mix">⚡ Mix</button>
        </div>
      </div>
      <div class="form-section" id="detailFields" style="display:none">
        <label class="form-label">Szczegóły (opcjonalne)</label>
        <div id="runFields" class="fields-group" style="display:none">
          <div class="field-row"><span class="field-label">Dystans</span><input type="number" id="runDist" min="0" step="0.1" placeholder="0.0"><span class="field-unit">km</span></div>
        </div>
        <div id="walkFields" class="fields-group" style="display:none">
          <div class="field-row"><span class="field-label">Dystans</span><input type="number" id="walkDist" min="0" step="0.1" placeholder="0.0"><span class="field-unit">km</span></div>
          <div class="field-row"><span class="field-label">Obciążenie</span><input type="number" id="walkWeight" min="0" step="0.5" placeholder="0"><span class="field-unit">kg</span></div>
        </div>
        <div id="strengthFields" class="fields-group" style="display:none">
          <div class="strength-grid">
            <div class="strength-row"><span class="strength-ex">Podciąganie</span><input type="number" id="pullSeries" min="0" placeholder="serie"><input type="number" id="pullReps" min="0" placeholder="powt."></div>
            <div class="strength-row"><span class="strength-ex">Przysiady</span><input type="number" id="sqSeries" min="0" placeholder="serie"><input type="number" id="sqReps" min="0" placeholder="powt."></div>
            <div class="strength-row"><span class="strength-ex">Pompki</span><input type="number" id="pushSeries" min="0" placeholder="serie"><input type="number" id="pushReps" min="0" placeholder="powt."></div>
            <div class="strength-row"><span class="strength-ex">Brzuszki</span><input type="number" id="absSeries" min="0" placeholder="serie"><input type="number" id="absReps" min="0" placeholder="powt."></div>
            <div style="font-size:0.7rem;color:var(--text-dim);padding:2px 4px;">&nbsp;&nbsp;seria → powtórzenia</div>
          </div>
        </div>
        <div id="swimFields" class="fields-group" style="display:none">
          <div class="field-row"><span class="field-label">Długości</span><input type="number" id="swimLaps" min="0" placeholder="0"><span class="field-unit">× 25m</span></div>
          <div class="field-row"><span class="field-label">Czas</span><input type="number" id="swimTime" min="0" placeholder="0"><span class="field-unit">min</span></div>
        </div>
        <div id="mixFields" class="fields-group" style="display:none">
          <div class="field-row"><span class="field-label">Dystans</span><input type="number" id="mixDist" min="0" step="0.1" placeholder="0.0"><span class="field-unit">km</span></div>
          <div class="field-row"><span class="field-label">Czas</span><input type="number" id="mixTime" min="0" placeholder="0"><span class="field-unit">min</span></div>
        </div>
      </div>
      <button class="btn-save" id="saveActivityBtn">Zapisz aktywność</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp }    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot }
                            from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ╔══════════════════════════════════════════════════════╗
// ║  🔧 WKLEJ TUTAJ SWOJE DANE Z FIREBASE CONSOLE       ║
// ╚══════════════════════════════════════════════════════╝
const firebaseConfig = {
  apiKey:            "AIzaSyCeGbbuCa5-gunOV9kRzpwDwQovezJlPVs",
  authDomain:        "plan-treningow-f9322.firebaseapp.com",
  projectId:         "plan-treningow-f9322",
  storageBucket:     "plan-treningow-f9322.firebasestorage.app",
  messagingSenderId: "916818362715",
  appId:             "1:916818362715:web:cf92a6c0baf34e13cfda7e"
};
// ══════════════════════════════════════════════════════

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

const MONTHS = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec',
                'Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
const TYPE_CONFIG = {
  run:      { label:'Bieg',   icon:'🏃', color:'var(--run)' },
  walk:     { label:'Marsz',  icon:'🚶', color:'var(--walk)' },
  strength: { label:'Siłowy', icon:'🏋️', color:'var(--strength)' },
  swim:     { label:'Basen',  icon:'🏊', color:'var(--swim)' },
  mix:      { label:'Mix',    icon:'⚡', color:'var(--mix)' },
};

let currentYear  = new Date().getFullYear();
let currentMonth = new Date().getMonth();
let selectedDay  = null;
let editingId    = null;
let selectedType = null;
let cache        = {};
let unsubscribe  = null;

function genId()       { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function docId(y, m)   { return `${y}_${String(m+1).padStart(2,'0')}`; }
function getMonthData(y, m) { return cache[docId(y,m)] || {}; }

function setSyncStatus(state, text) {
  const el = document.getElementById('syncStatus');
  el.className = state;
  document.getElementById('syncText').textContent = text;
}

// ── Zapis do Firestore ──────────────────────────────────────
async function saveToFirestore(y, m, data) {
  setSyncStatus('syncing', 'Zapisywanie...');
  try {
    await setDoc(doc(db, 'treningi', docId(y, m)), { data: JSON.stringify(data) });
    setSyncStatus('ok', 'Zsynchronizowano ✓');
    setTimeout(() => setSyncStatus('', 'Połączono z bazą danych'), 2500);
  } catch(e) {
    console.error(e);
    setSyncStatus('error', 'Błąd zapisu – sprawdź konfigurację Firebase');
  }
}

// ── Nasłuchiwanie na zmiany (real-time) ────────────────────
function subscribeMonth(y, m) {
  if (unsubscribe) unsubscribe();
  setSyncStatus('syncing', 'Ładowanie danych...');
  unsubscribe = onSnapshot(
    doc(db, 'treningi', docId(y, m)),
    snap => {
      cache[docId(y,m)] = snap.exists() ? (() => { try { return JSON.parse(snap.data().data); } catch { return {}; } })() : {};
      setSyncStatus('ok', 'Połączono ✓');
      setTimeout(() => setSyncStatus('', 'Połączono z bazą danych'), 1500);
      renderCalendar();
      if (selectedDay) renderDayActivities();
    },
    err => {
      console.error(err);
      setSyncStatus('error', 'Błąd połączenia – sprawdź konfigurację Firebase');
    }
  );
}

// ── Kalendarz ───────────────────────────────────────────────
function renderCalendar() {
  document.getElementById('monthLabel').textContent = `${MONTHS[currentMonth]} ${currentYear}`;
  const grid = document.getElementById('daysGrid');
  grid.innerHTML = '';
  const data  = getMonthData(currentYear, currentMonth);
  const today = new Date();
  const offset      = (new Date(currentYear, currentMonth, 1).getDay() + 6) % 7;
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

  for (let i = 0; i < offset; i++) {
    const e = document.createElement('div'); e.className = 'day empty'; grid.appendChild(e);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const cell = document.createElement('div');
    cell.className = 'day';
    if (d===today.getDate() && currentMonth===today.getMonth() && currentYear===today.getFullYear())
      cell.classList.add('today');
    const num = document.createElement('div');
    num.className = 'day-num'; num.textContent = d; cell.appendChild(num);
    const acts = data[d] || [];
    acts.slice(0,3).forEach(a => {
      const dot = document.createElement('div');
      dot.className = 'activity-dot' + (a.done ? ' done-act' : '');
      dot.style.background = TYPE_CONFIG[a.type].color;
      dot.innerHTML = `<span>${TYPE_CONFIG[a.type].icon}</span><span>${TYPE_CONFIG[a.type].label}</span>`;
      if (a.done) dot.innerHTML += `<span style="font-size:0.65rem">✓</span>`;
      cell.appendChild(dot);
    });
    if (acts.length > 3) {
      const more = document.createElement('div');
      more.style.cssText = 'font-size:0.6rem;color:var(--text-dim);padding:1px 4px;';
      more.textContent = `+${acts.length-3} więcej`; cell.appendChild(more);
    }
    cell.addEventListener('click', () => openDayModal(d));
    grid.appendChild(cell);
  }
}

// ── Modal dnia ──────────────────────────────────────────────
function openDayModal(day) {
  selectedDay = day;
  document.getElementById('dayModalTitle').textContent = `${day} ${MONTHS[currentMonth]} ${currentYear}`;
  renderDayActivities();
  document.getElementById('dayOverlay').classList.add('open');
}

function renderDayActivities() {
  const data = getMonthData(currentYear, currentMonth);
  const acts = data[selectedDay] || [];
  const container = document.getElementById('dayActivitiesList');
  container.innerHTML = '';
  if (!acts.length) { container.innerHTML = '<div class="no-acts">Brak aktywności w tym dniu.</div>'; return; }
  acts.forEach(a => {
    const card = document.createElement('div');
    card.className = 'act-card';
    card.style.borderColor = TYPE_CONFIG[a.type].color;
    const details = formatDetails(a);
    card.innerHTML = `
      <div class="act-card-top">
        <div class="act-name" style="color:${TYPE_CONFIG[a.type].color}">
          ${TYPE_CONFIG[a.type].icon} ${TYPE_CONFIG[a.type].label}
          ${a.done ? '<span style="color:#4caf50;font-size:0.8rem;">✓ Wykonane</span>' : ''}
        </div>
      </div>
      ${details ? `<div class="act-details">${details}</div>` : ''}
      <div class="act-actions">
        <button class="btn-sm btn-edit" data-id="${a.id}">✏️ Edytuj</button>
        <button class="btn-sm btn-done ${a.done?'is-done':''}" data-id="${a.id}">${a.done?'✓ Wykonane':'☐ Oznacz jako wykonane'}</button>
        <button class="btn-sm btn-del" data-id="${a.id}">🗑</button>
      </div>`;
    card.querySelector('.btn-edit').addEventListener('click', () => { closeDayModal(); openFormModal(a.id); });
    card.querySelector('.btn-done').addEventListener('click', () => toggleDone(a.id));
    card.querySelector('.btn-del').addEventListener('click',  () => deleteActivity(a.id));
    container.appendChild(card);
  });
}

function formatDetails(a) {
  const lines = [];
  if (a.type==='run'||a.type==='walk') {
    if (a.dist)   lines.push(`Dystans: <b>${a.dist} km</b>`);
    if (a.type==='walk' && a.weight) lines.push(`Obciążenie: <b>${a.weight} kg</b>`);
  } else if (a.type==='strength') {
    [['Podciąganie',a.pullSeries,a.pullReps],['Przysiady',a.sqSeries,a.sqReps],
     ['Pompki',a.pushSeries,a.pushReps],['Brzuszki',a.absSeries,a.absReps]].forEach(([n,s,r]) => {
      if (s||r) lines.push(`${n}: <b>${s||'?'} serie × ${r||'?'} powt.</b>`);
    });
  } else if (a.type==='swim') {
    if (a.laps) lines.push(`Długości: <b>${a.laps} × 25m</b>`);
    if (a.time) lines.push(`Czas: <b>${a.time} min</b>`);
  } else if (a.type==='mix') {
    if (a.dist) lines.push(`Dystans: <b>${a.dist} km</b>`);
    if (a.time) lines.push(`Czas: <b>${a.time} min</b>`);
  }
  return lines.join('<br>');
}

async function toggleDone(id) {
  const data = getMonthData(currentYear, currentMonth);
  const act  = (data[selectedDay]||[]).find(a => a.id===id);
  if (act) act.done = !act.done;
  cache[docId(currentYear,currentMonth)] = data;
  renderDayActivities(); renderCalendar();
  await saveToFirestore(currentYear, currentMonth, data);
}

async function deleteActivity(id) {
  const data = getMonthData(currentYear, currentMonth);
  data[selectedDay] = (data[selectedDay]||[]).filter(a => a.id!==id);
  cache[docId(currentYear,currentMonth)] = data;
  renderDayActivities(); renderCalendar();
  await saveToFirestore(currentYear, currentMonth, data);
}

function closeDayModal() { document.getElementById('dayOverlay').classList.remove('open'); }

// ── Modal formularza ────────────────────────────────────────
function openFormModal(editId) {
  editingId = editId||null; selectedType = null;
  document.getElementById('formModalTitle').textContent = editId ? 'Edytuj aktywność' : 'Nowa aktywność';
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('detailFields').style.display = 'none';
  ['run','walk','strength','swim','mix'].forEach(t => document.getElementById(t+'Fields').style.display='none');
  clearInputs();
  if (editId) {
    const data = getMonthData(currentYear, currentMonth);
    const act  = (data[selectedDay]||[]).find(a => a.id===editId);
    if (act) prefillForm(act);
  }
  document.getElementById('formOverlay').classList.add('open');
}

function prefillForm(a) {
  selectType(a.type);
  if (a.type==='run')      setVal('runDist', a.dist);
  if (a.type==='walk')     { setVal('walkDist', a.dist); setVal('walkWeight', a.weight); }
  if (a.type==='strength') {
    setVal('pullSeries',a.pullSeries); setVal('pullReps',a.pullReps);
    setVal('sqSeries',a.sqSeries);     setVal('sqReps',a.sqReps);
    setVal('pushSeries',a.pushSeries); setVal('pushReps',a.pushReps);
    setVal('absSeries',a.absSeries);   setVal('absReps',a.absReps);
  }
  if (a.type==='swim') { setVal('swimLaps',a.laps); setVal('swimTime',a.time); }
  if (a.type==='mix')  { setVal('mixDist',a.dist);  setVal('mixTime',a.time); }
}

function setVal(id, val) { if (val!=null) { const el=document.getElementById(id); if(el) el.value=val; } }

function selectType(type) {
  selectedType = type;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('selected', b.dataset.type===type));
  ['run','walk','strength','swim','mix'].forEach(t => document.getElementById(t+'Fields').style.display = t===type?'block':'none');
  document.getElementById('detailFields').style.display = 'block';
}

function clearInputs() {
  ['runDist','walkDist','walkWeight','pullSeries','pullReps','sqSeries','sqReps',
   'pushSeries','pushReps','absSeries','absReps','swimLaps','swimTime','mixDist','mixTime']
  .forEach(id => { const el=document.getElementById(id); if(el) el.value=''; });
}

function closeFormModal() { document.getElementById('formOverlay').classList.remove('open'); }

async function saveActivity() {
  if (!selectedType) { alert('Wybierz rodzaj aktywności!'); return; }
  const btn = document.getElementById('saveActivityBtn');
  btn.disabled = true; btn.textContent = 'Zapisywanie...';

  const g  = id => { const el=document.getElementById(id); return el?(el.value||''):''; };
  const n  = id => { const v=parseFloat(g(id)); return (isNaN(v)||v<=0)?null:v; };
  const ni = id => { const v=parseInt(g(id));   return (isNaN(v)||v<=0)?null:v; };

  let act = { type:selectedType, done:false, id:editingId||genId() };
  if (selectedType==='run')      act.dist = n('runDist');
  if (selectedType==='walk')     { act.dist=n('walkDist'); act.weight=n('walkWeight'); }
  if (selectedType==='strength') {
    act.pullSeries=ni('pullSeries'); act.pullReps=ni('pullReps');
    act.sqSeries=ni('sqSeries');     act.sqReps=ni('sqReps');
    act.pushSeries=ni('pushSeries'); act.pushReps=ni('pushReps');
    act.absSeries=ni('absSeries');   act.absReps=ni('absReps');
  }
  if (selectedType==='swim') { act.laps=ni('swimLaps'); act.time=ni('swimTime'); }
  if (selectedType==='mix')  { act.dist=n('mixDist');   act.time=ni('mixTime'); }

  const data = getMonthData(currentYear, currentMonth);
  if (!data[selectedDay]) data[selectedDay] = [];
  if (editingId) {
    const idx = data[selectedDay].findIndex(a => a.id===editingId);
    if (idx!==-1) { act.done=data[selectedDay][idx].done; data[selectedDay][idx]=act; }
  } else {
    data[selectedDay].push(act);
  }
  cache[docId(currentYear,currentMonth)] = data;
  renderCalendar();
  await saveToFirestore(currentYear, currentMonth, data);
  btn.disabled=false; btn.textContent='Zapisz aktywność';
  closeFormModal();
  openDayModal(selectedDay);
}

// ── Eventy ──────────────────────────────────────────────────
document.getElementById('prevBtn').addEventListener('click', () => {
  currentMonth--; if(currentMonth<0){currentMonth=11;currentYear--;}
  subscribeMonth(currentYear, currentMonth);
});
document.getElementById('nextBtn').addEventListener('click', () => {
  currentMonth++; if(currentMonth>11){currentMonth=0;currentYear++;}
  subscribeMonth(currentYear, currentMonth);
});
document.getElementById('closeDayModal').addEventListener('click', closeDayModal);
document.getElementById('closeFormModal').addEventListener('click', closeFormModal);
document.getElementById('dayOverlay').addEventListener('click',  e => { if(e.target===e.currentTarget) closeDayModal(); });
document.getElementById('formOverlay').addEventListener('click', e => { if(e.target===e.currentTarget) closeFormModal(); });
document.getElementById('addActivityBtn').addEventListener('click', () => { closeDayModal(); openFormModal(null); });
document.querySelectorAll('.type-btn').forEach(btn => btn.addEventListener('click', () => selectType(btn.dataset.type)));
document.getElementById('saveActivityBtn').addEventListener('click', saveActivity);

// ── Start ────────────────────────────────────────────────────
subscribeMonth(currentYear, currentMonth);
</script>
</body>
</html>
